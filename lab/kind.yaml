# Clúster kind del laboratorio.
#
# `ingress-ready: "true"` y el mapeo de puertos son lo que pide el despliegue de
# ingress-nginx para kind: el controller usa hostPort en el nodo, y kind lo saca
# al host por el 8088. Así el navegador recorre el mismo camino que recorrerá en
# gitops-prod —Ingress, nginx, Service— en vez de un port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
