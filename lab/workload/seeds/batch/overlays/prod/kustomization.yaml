apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Semilla del arquetipo `batch`. La usa `lab/levantar.sh` para sembrar el repo
# de cualquier workload cuya Application lleve
# `argo-cd-labs.dev/arquetipo: batch`.
#
# La forma importa y es la misma para todos los arquetipos: las Application de
# `overlays/prod/apps/` apuntan a `path: overlays/prod`, así que un repo de
# workload debe tener esta estructura. El contenido no representa a ningún
# workload real.
resources:
  - job.yaml
