apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Semilla del arquetipo `stateful`. La usa `lab/levantar.sh` para sembrar el
# repo de cualquier workload cuya Application lleve
# `argo-cd-labs.dev/arquetipo: stateful`.
#
# No reproduce lo que ese workload despliega en producción: solo su forma y las
# propiedades que hay que poder probar —que el volumen sobrevive al pod y que
# el PVC está protegido del prune.
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
