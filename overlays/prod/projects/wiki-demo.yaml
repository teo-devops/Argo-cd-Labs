# ============================================================================
# AppProject del workload "wiki-demo" — su frontera en Argo CD.
#
# Un AppProject por workload. Es la pieza de aislamiento: restringe de qué repo
# se lee y en qué namespace se escribe. Se escribe A MANO y se revisa a mano en
# el PR; no se autogenera, porque generar el objeto que define tus propios
# límites de privilegio anula el control que ejerce.
#
# Para dar de alta otro workload NO se copia este fichero: se parte de
# `plantillas/workload-appproject.yaml`, que es neutro. Este es un ejemplo, y
# sus comentarios hablan de un dominio concreto.
#
# ALCANCE DE ESTE WORKLOAD: todo `wiki-demo`. La aplicación y su base de datos
# NO son dos workloads: son dos componentes de uno. Se despliegan juntos, se
# versionan juntos, fallan juntos y los mantiene el mismo equipo — y eso, no el
# hecho de que se hablen por red, es lo que los convierte en una unidad. La
# unidad de aislamiento es el límite de despliegue y de propiedad, no el binario
# ni el grafo de llamadas.
#
# Si esa base de datos la usaran TRES workloads, dejaría de ser un componente
# interno y pasaría a ser un servicio compartido: su propio workload, con su
# namespace y su repo. El criterio está en docs/arquetipos.md §4.
# Ver docs/aislamiento-multi-workload.md §1.1.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wiki-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: wiki-demo (herramienta interna y su base de datos), confinado a su namespace homónimo.

  # --- 1. De qué repositorio puede leer ------------------------------------
  # Uno solo. Si una Application de este proyecto apuntase a otro repo, Argo CD
  # rechaza el sync antes de renderizar nada.
  sourceRepos:
    - 'https://github.com/teo-devops/workload-wiki-demo.git'

  # --- 2. Dónde puede escribir ---------------------------------------------
  # Un namespace exacto, sin comodín. Cualquier manifiesto del repo que declare
  # otro namespace hace fallar el sync COMPLETO con un error explícito; no se
  # despliega parcialmente. Esto es lo que impide que un workload toque a otro.
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: wiki-demo

  # --- 3. Recursos cluster-scoped: SOLO Namespace --------------------------
  # El workload no puede crear CRD, ClusterRole, ClusterRoleBinding ni
  # PersistentVolume. `Namespace` sí, y es OBLIGATORIO que esté aquí:
  #
  #   `CreateNamespace=true` de la Application NO esquiva esta lista. Argo CD
  #   3.4 crea el namespace como una tarea PreSync y la valida contra el
  #   proyecto, así que con la lista vacía el PRIMER SYNC FALLA con:
  #
  #     resource :Namespace is not permitted in project wiki-demo
  #
  #   Comprobado en un clúster real, no deducido de la documentación.
  #
  # RIESGO QUE ESTO ABRE, y hay que conocerlo:
  # `destinations` no filtra recursos cluster-scoped, porque no tienen namespace
  # que comparar. Con `Namespace` permitido, el repo del workload puede declarar
  # CUALQUIER namespace, no solo el suyo — incluido el de otro workload, del que
  # pasaría a ser dueño. También verificado: un manifiesto con un namespace
  # ajeno se aplica y Argo CD no lo impide.
  #
  # Se acepta a propósito, por simplicidad, mientras los repos de workload sean
  # de confianza. La regla que lo sostiene es de proceso, no técnica:
  #
  #   **el repo del workload no declara ningún objeto Namespace.**
  #
  # Si algún día un workload deja de ser de confianza, la salida es que
  # plataforma cree los namespaces desde este repo y se retiren tanto esta
  # entrada como `CreateNamespace=true`.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  # --- 4. Recursos namespaced que el workload NO puede tocar ---------------
  # Solo RBAC. `ResourceQuota`, `LimitRange` y `NetworkPolicy` se retiraron
  # deliberadamente de esta lista: plataforma no impone límites ni política de
  # red, así que prohibírselos al workload no producía gobierno, producía un
  # clúster sin ningún límite. Cada workload se autolimita si quiere, dentro de
  # su propio namespace, y eso queda visible en el diff de su repo.
  #
  # `Role` y `RoleBinding` siguen bloqueados: un workload no se concede
  # permisos de API a sí mismo. Consecuencia práctica que hay que tener
  # presente al portar charts de terceros: cualquiera que traiga su propio RBAC
  # —y son muchos— fallará el sync hasta que plataforma cree ese Role a mano o
  # se decida abrirlo.
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

  # --- 5. Quién lo opera en la UI de Argo CD -------------------------------
  # INACTIVO. Este bloque solo surte efecto cuando Dex esté conectado a un OIDC
  # (ver `dex.config` en config/argo-cd/values.yaml, hoy comentado). Sin un
  # proveedor OIDC que emita el claim `groups`, estas políticas no se aplican a
  # nadie: el acceso real hoy es la cuenta `admin`. Para dar acceso a este
  # workload SIN esperar al SSO, se ata una cuenta local a este mismo rol desde
  # `policy.csv` (`g, ana, proj:wiki-demo:developer`); ver docs/operar.md.
  roles:
    - name: developer
      description: Sync y lectura sobre las Applications de wiki-demo
      policies:
        - p, proj:wiki-demo:developer, applications, get, wiki-demo/*, allow
        - p, proj:wiki-demo:developer, applications, sync, wiki-demo/*, allow
        - p, proj:wiki-demo:developer, logs, get, wiki-demo/*, allow
      groups:
        - teo-devops/wiki-demo

  # Avisa (sin borrar) de recursos que existen en el namespace pero no están
  # declarados en Git — el detector de `kubectl` clandestino.
  orphanedResources:
    warn: true
